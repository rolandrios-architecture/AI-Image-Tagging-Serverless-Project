name: Dev API Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'api/**'
      - '.github/workflows/dev-api.yml'

jobs:
  api-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/aiImageTagging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Show Node version
        run: node -v

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint || echo "No lint configured"

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high || echo "Audit warnings"