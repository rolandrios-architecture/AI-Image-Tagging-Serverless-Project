name: Dev API Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'api/**'

jobs:
  api-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/aiImageTagging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Show Node version
        run: node -v

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests yet"
      
      - name: Build
        run: npm run build || echo "No build step"