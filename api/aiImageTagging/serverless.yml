# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: learnstack
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aiImageTagging

provider:
  name: aws
  runtime: nodejs24.x
  httpApi:
    cors:
      allowedOrigins:
        - 'http://localhost:5173'
        - 'http://localhost:5174'
        - 'http://ai-image-tagging-qa-frontend.s3-website-us-east-1.amazonaws.com'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowCredentials: false
  environment:
    REGION: us-east-1
    BUCKET_NAME: ai-image-tagging-uploads
    DYNAMODB_NAME: image-results-table
    # SNS topic ARN for error notifications (used by error handling service)
    SNS_TOPIC_ARN: arn:aws:sns:us-east-1:506587498790:image-processing-errors
  iamRoleStatements:
  - Effect: 'Allow'
    Action:
      - s3:PutObject
      - s3:GetObject
      - s3:DeleteObject
    Resource: arn:aws:s3:::ai-image-tagging-uploads/*

  - Effect: 'Allow'
    Action:
      - s3:PutBucketCORS
      - s3:GetBucketCORS
    Resource: arn:aws:s3:::ai-image-tagging-uploads

  - Effect: 'Allow'
    Action:
      - rekognition:DetectLabels
    Resource: '*'

  - Effect: 'Allow'
    Action:
      - bedrock:InvokeModel
    Resource: "*"

  - Effect: 'Allow'
    Action:
      - dynamodb:PutItem
      - dynamodb:UpdateItem
      - dynamodb:GetItem
    Resource:
      - arn:aws:dynamodb:us-east-1:506587498790:table/image-results-table

  - Effect: 'Allow'
    Action:
      - sns:Publish
    Resource:
      - Ref: ErrorTopic
resources:
  Resources:
    BannerImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ai-image-tagging-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - 'http://localhost:5173'
                - 'http://localhost:5174'
              AllowedMethods:
                - PUT
                - POST
                - GET
                - HEAD
              AllowedHeaders:
                - '*'
    ImageResultsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: image-results-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: fileName
            AttributeType: S
        KeySchema:
          - AttributeName: fileName
            KeyType: HASH
    ErrorTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: image-processing-errors
    ErrorSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: ErrorTopic
        Protocol: email
        Endpoint: riosroland97@gmail.com
functions:
  uploadImage:
    handler: handlers/uploadUrlHandler.uploadUrlHandler
    events:
      - httpApi:
          path: /upload-image
          method: post
          # CORS is configured at provider.httpApi.cors
  getImageLabels:
    handler: handlers/processImageHandler.processImageRecognition
    events:
      - s3:
          bucket: ai-image-tagging-uploads
          event: s3:ObjectCreated:*
          existing: true 
  getImage:
    handler: handlers/getImageHandler.getImage
    events:
      - httpApi:
          path: /images/{fileName+}
          method: get